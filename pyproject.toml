[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbmsbenchmarker"
dynamic = ["version", "dependencies"]

description = "DBMS-Benchmarker is a Python-based application-level blackbox benchmark tool for Database Management Systems (DBMS). It connects to a given list of DBMS (via JDBC) and runs a given list of parametrized and randomized (SQL) benchmark queries. Evaluations are available via Python interface, in reports and at an interactive multi-dimensional dashboard."

readme = { file = "README.md", content-type = "text/markdown" }

authors = [
  { name = "Patrick K. Erdelt", email = "patrick.erdelt@bht-berlin.de" },
  { name = "Jascha Jestel" },
]

license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

# The pinned urllib3 needs Python 3.10; CI tests 3.10 to 3.13.
requires-python = ">=3.10"

keywords = ["DBMS", "benchmarking", "performance evaluation", "JDBC", "SQL", "reproducibility"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Database",
  "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/Beuth-Erdelt/DBMS-Benchmarker"
Repository = "https://github.com/Beuth-Erdelt/DBMS-Benchmarker"
Documentation = "https://dbmsbenchmarker.readthedocs.io"
Changelog = "https://github.com/Beuth-Erdelt/DBMS-Benchmarker/releases"
Issues = "https://github.com/Beuth-Erdelt/DBMS-Benchmarker/issues"

[project.scripts]
dbmsbenchmarker = "dbmsbenchmarker.scripts.cli:run_benchmarker"
dbmsdashboard   = "dbmsbenchmarker.scripts.dashboardcli:startup"
dbmsinspect     = "dbmsbenchmarker.scripts.inspect:result"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dbmsbenchmarker*"]

[tool.setuptools.package-data]
dbmsbenchmarker = [
  "dbmsbenchmarker/scripts/assets/*"
]

[tool.setuptools.dynamic]
version = { attr = "dbmsbenchmarker.__version__" }
dependencies = { file = ["requirements.txt"] }
