name: Publish Python 🐍 distributions 📦 to PyPI and TestPyPI

# Runs when a GitHub release is published (the release tag is vX.Y.Z), or by hand
# from the Actions tab. Release events do not support branch or tag filters.
# Zenodo archives the same release through its GitHub integration.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    # Nothing is uploaded unless the tests pass.
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install pypa/build
      run: python -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/ .
    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
