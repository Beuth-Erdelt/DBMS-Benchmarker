name: Tests
on:
  pull_request:
  push:
    branches: [master, dev]
  # The publish workflow runs the tests before it uploads a release.
  workflow_call:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The end-to-end test runs a benchmark through JDBC against SQLite.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download the SQLite JDBC driver
        run: |
          mkdir -p tests/jars
          curl -sSfL -o tests/jars/sqlite-jdbc-3.47.1.0.jar https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.47.1.0/sqlite-jdbc-3.47.1.0.jar
          echo "4164d95347aeab42b754cabb7945b93e54f29ddb2eded967dbe979b4045cb685  tests/jars/sqlite-jdbc-3.47.1.0.jar" | sha256sum -c -
      - run: pip install -r requirements.txt -e .
      - run: python -m unittest discover tests -v
