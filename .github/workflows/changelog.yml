name: Changelog
# Every pull request adds an entry to CHANGELOG.md, unless it carries the
# label "no-changelog" (changes users cannot notice: CI, typos, refactoring).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG.md is part of the pull request
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add an entry under Unreleased, or label the pull request no-changelog."
            exit 1
          fi
